# Builds the Windows installer (and the folder Steam needs) on a real Windows
# machine. Runs when a Release is published on GitHub (the files are then
# attached to that Release), or by hand from the Actions tab.
name: Build Windows game

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every level can be finished
        run: npm run check

      - name: Build the game
        run: npm run build

      - name: Package installer and Steam folder
        run: npx electron-builder --win --x64 --publish never

      - name: Zip the folder for Steam
        shell: pwsh
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/Ember-Hollow-Windows-for-Steam.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Hollow-Windows
          path: |
            release/Ember-Hollow-Setup-*.exe
            release/Ember-Hollow-Windows-for-Steam.zip

      - name: Attach the files to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: Ember Hollow ${{ github.event.release.tag_name }}
          body: |
            **To play on Windows:** download `Ember-Hollow-Setup` below, open it, and the game installs and starts by itself.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            `Ember-Hollow-Windows-for-Steam.zip` is the version you upload to Steam.
          files: |
            release/Ember-Hollow-Setup-*.exe
            release/Ember-Hollow-Windows-for-Steam.zip
