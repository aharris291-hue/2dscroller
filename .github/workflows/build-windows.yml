# Builds the Windows installer (and the folder Steam needs) on a real Windows
# machine. Runs when a version tag like v1.0.0 is pushed, or by hand from the
# Actions tab. Tagged builds are attached to a GitHub Release for easy download.
name: Build Windows game

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every level can be finished
        run: npm run check

      - name: Build the game
        run: npm run build

      - name: Package installer and Steam folder
        run: npx electron-builder --win --x64 --publish never

      - name: Zip the folder for Steam
        shell: pwsh
        run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/Ember-Hollow-Windows-for-Steam.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Hollow-Windows
          path: |
            release/Ember-Hollow-Setup-*.exe
            release/Ember-Hollow-Windows-for-Steam.zip

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ember Hollow ${{ github.ref_name }}
          body: |
            **To play on Windows:** download `Ember-Hollow-Setup` below, open it, and the game installs and starts by itself.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            `Ember-Hollow-Windows-for-Steam.zip` is the version you upload to Steam.
          files: |
            release/Ember-Hollow-Setup-*.exe
            release/Ember-Hollow-Windows-for-Steam.zip
